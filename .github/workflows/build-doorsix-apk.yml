name: Build DoorSix APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'doorsix-v*.*.*'
  pull_request:
    paths:
      - 'assets/**'
      - 'docs/**'
      - 'lib/**'
      - 'test/**'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - '.github/workflows/build-doorsix-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name door_six .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/doorsix-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doorsix-release-apk
          path: build/app/outputs/flutter-apk/doorsix-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/doorsix-v')
    needs: build-apk
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: doorsix-release-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/doorsix-release.apk
          generate_release_notes: true
