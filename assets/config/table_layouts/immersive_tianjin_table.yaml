    debugName: 横屏/顶栏
    component: GameTopBar
    landscape:
      regular:
        bucketPosition:
          mode: bucket
          x: 1.3
          y: 1.9
          width: 97.4
          height: 12.9
          anchor: topLeft
      compact:
        bucketPosition:
          mode: bucket
          x: 1.3
          y: 1.9
          width: 97.4
          height: 12.9
          anchor: topLeft

  - id: seat_stage
