schema: door_six.game_table_layout.v1
id: immersive_tianjin_table
name: 新版沉浸式牌桌
targetExperience: immersive

layoutGrid:
  columns: 100
  rows: 100

breakpoints:
  landscape:
    compactWhen:
      maxLogicalHeight: 430
      maxLogicalWidth: 900

layers:
