name: door_six
description: "A Flutter prototype for the Tianjin six-player card game Zha Liu Jia."
publish_to: 'none'

version: 0.1.8+9

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.6.0
  flutter_animate: ^4.5.2
  go_router: ^17.2.3
  playing_cards: ^0.4.1+11
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sound/
    - assets/config/rules/
    - server/config/game_settings.json
